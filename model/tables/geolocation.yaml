tables:
  - name: geolocation
    title: Geolocation Data
    sql: {{ load_sql('geolocation') }}
    description: Table containing geolocation data for delivery zip codes and warehouse locations.
    public: true
    dimensions:
      - name: zip_code
        description: The zip code associated with the location.
        type: number
        column: zip_code
        primary_key: true
        public: true
      - name: latitude
        description: The latitude coordinate of the location.
        type: number
        column: latitude
        public: true
      - name: longitude
        description: The longitude coordinate of the location.
        type: number
        column: longitude
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.zip_code}"
